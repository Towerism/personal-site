services:
  site:
    # CI builds, smoke-tests and pushes this image on every v*.*.* tag. The Pi
    # pulls it instead of building: building there stalls the whole host (#10).
    image: ghcr.io/towerism/personal-site:latest
    # Portainer's redeploy runs `compose up`; this makes it pull the newest
    # image instead of reusing the one already on the Pi.
    pull_policy: always
    # Caddy reaches the site as http://personal-site:8080 over web-proxy-net.
    container_name: personal-site
    restart: unless-stopped
    networks:
      - web-proxy-net
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web-proxy-net:
    external: true
